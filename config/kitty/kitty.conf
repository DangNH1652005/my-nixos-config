
# Font
font_family JetBrainsMono Nerd Font Mono
font_size 11.2

# Colors
foreground #f5e6f0
background #1e1721
cursor #ffb7d5

# Normal colors
color0 #1e1721
color1 #e06c9f
color2 #a8d5ba
color3 #f2d49b
color4 #9bb7e8
color5 #d8a7d9
color6 #91d8d0
color7 #d9c8d2

# Bright colors
color8 #594556
color9 #ff8fbd
color10 #b8e0c8
color11 #f7dfa9
color12 #b3c8f0
color13 #e5b5e5
color14 #a8e6df
color15 #fff0f7

# Selection
selection_foreground #1e1721
selection_background #ffb7d5

# General settings
scrollback_lines 1000
disable_ligatures no
enable_audio_bell no

# Shell
shell zsh
shell_integration no-rc

# Cursor
cursor_shape block
cursor_blink_interval 0

# URLs
url_style curly

# Window
remember_window_size no
initial_window_width 640
initial_window_height 480
window_padding_width 5
background_opacity 0.80

# Scrollbar
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

# Other
confirm_os_window_close 0
sync_to_monitor no
